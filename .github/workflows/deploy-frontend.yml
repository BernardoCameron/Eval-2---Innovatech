name: Deploy Frontend to AWS ECS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'front_despacho/**'
      - 'ecs/task-def-frontend.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECS_CLUSTER: familiar-frog-armxey

jobs:
  # Job 1 - Compilar imagen del frontend y subirla a ECR
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${{ env.AWS_REGION }}
          output=json
          EOF

      # Login en ECR usando las credenciales de AWS
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
          ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Frontend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech/frontend:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech/frontend:1.0.${{ github.run_number }}

  # Job 2 - Registrar task definition y desplegar en ECS
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${{ env.AWS_REGION }}
          output=json
          EOF

      # Crear el log group en CloudWatch si no existe
      - name: Ensure CloudWatch Log Group exists
        run: |
          aws logs create-log-group --log-group-name /ecs/innovatech --region ${{ env.AWS_REGION }} || true

      # Registrar la task definition del frontend en ECS y guardar su ARN
      - name: Register Frontend Task Definition
        id: register-frontend
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://ecs/task-def-frontend.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "frontend_task_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      # Forzar nuevo deploy: ECS reemplaza el contenedor con la imagen nueva
      - name: Deploy Frontend service to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service svc-frontend \
            --task-definition ${{ steps.register-frontend.outputs.frontend_task_arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'back-Ventas_SpringBoot/**'
      - 'back-Despachos_SpringBoot/**'
      - 'ecs/task-def-ventas.json'
      - 'ecs/task-def-despachos.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECS_CLUSTER: familiar-frog-armxey

jobs:
  # Job 1 - Compilar imagenes y subirlas a ECR
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${{ env.AWS_REGION }}
          output=json
          EOF

      # Login en ECR usando las credenciales de AWS
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
          ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Ventas image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech/api-ventas:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech/api-ventas:1.0.${{ github.run_number }}

      - name: Build and Push Despachos image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech/api-despachos:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech/api-despachos:1.0.${{ github.run_number }}

  # Job 2 - Registrar task definitions y desplegar en ECS
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${{ env.AWS_REGION }}
          output=json
          EOF

      # Crear el log group en CloudWatch si no existe
      - name: Ensure CloudWatch Log Group exists
        run: |
          aws logs create-log-group --log-group-name /ecs/innovatech --region ${{ env.AWS_REGION }} || true

      # Registrar la task definition de Ventas en ECS y guardar su ARN
      - name: Register Ventas Task Definition
        id: register-ventas
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://ecs/task-def-ventas.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "ventas_task_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      # Registrar la task definition de Despachos en ECS y guardar su ARN
      - name: Register Despachos Task Definition
        id: register-despachos
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://ecs/task-def-despachos.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "despachos_task_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      # Forzar nuevo deploy: ECS reemplaza los contenedores con la imagen nueva
      - name: Deploy Ventas service to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service svc-ventas \
            --task-definition ${{ steps.register-ventas.outputs.ventas_task_arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Despachos service to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service svc-despachos \
            --task-definition ${{ steps.register-despachos.outputs.despachos_task_arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
